services:
  postgres:
    image: postgres:16
    container_name: loop-and-stitch-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: loop_and_stitch
      POSTGRES_USER: loop_user
      POSTGRES_PASSWORD: loop_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: